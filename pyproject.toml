[project]
name = "ha-vrf-bridge"
version = "1.0.0"
description = "Home Assistant 自定义集成：通过 USB-RS485 直接控制 VRF 中央空调"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "voluptuous>=0.15"]
lint = ["ruff>=0.6", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["tests/support/simulator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "D"]
# 文档字符串使用中文，不套用英文句末标点规则；D202 与 Home Assistant 官方一致。
ignore = ["D202", "D203", "D213", "D400", "D406", "D407", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
disallow_untyped_defs = true
