name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pytest:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.10.2" pytest pytest-asyncio pytest-timeout pyserial pyyaml
      - name: Run tests
        run: python -m pytest tests -v

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pyserial "homeassistant==2026.10.2" pyyaml
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Mypy
        run: mypy custom_components/vrf_bridge
